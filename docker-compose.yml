services:
  standup:
    build: .
    container_name: standup-order-generator
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ${DATA_PATH:-./data}:/data
    environment:
      # User/group IDs for file ownership (match your host user)
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Timezone
      - TZ=${TZ:-America/New_York}
      # Port the app listens on (inside container, always 8080)
      - PORT=8080
      # Path to data directory inside container
      - DATA_PATH=/data
      # ── Google OAuth (required) ───────────────────────────────────────
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Public-facing base URL (no trailing slash) — used for OAuth redirect URI
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      # Super admin Gmail address
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-rtippenhauer@gmail.com}
      # Session signing secret — auto-generated if not set (sessions survive restarts if set)
      - SECRET_KEY=${SECRET_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/teams')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
